name: CI

on:
  push:
    branches: [ main, release, "upgrade/*" ]
  pull_request:
    branches: [ main, release ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Server Dependencies
        run: npm --prefix server install

      - name: Typecheck
        run: npm --prefix server run typecheck

      - name: Build TypeScript Server
        run: npm --prefix server run build

      - name: Run Vitest Unit & Mock-AE Integration Tests
        run: npm --prefix server test

      - name: Run Python Blender bpy Stub Tests
        run: npm --prefix server run test:python

      - name: Verify Docs Generation
        run: npm --prefix server run docs
