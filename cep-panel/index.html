<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AE Bridge</title>
    <style>
        body {
            background-color: #232323;
            color: #ececec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        h2 {
            font-size: 15px;
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-container {
            background-color: #2e2e2e;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 16px;
            font-size: 12px;
        }
        #status {
            font-weight: bold;
            color: #f44336;
        }
        .log-container {
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 4px;
            padding: 8px;
            max-height: 280px;
            overflow-y: auto;
        }
        .log-title {
            font-size: 11px;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
        }
        #log {
            list-style: none;
            padding: 0;
            margin: 0;
            font-family: "Cascadia Code", Consolas, monospace;
            font-size: 11px;
            line-height: 1.5;
        }
        #log li {
            border-bottom: 1px solid #292929;
            padding: 3px 0;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h2>
        <span>AE Bridge</span>
        <span style="font-size: 11px; color: #888888;">v1.3.0</span>
    </h2>

    <div class="status-container">
        Status: <span id="status">Disconnected — retrying</span>
    </div>

    <div class="log-title">Recent Activity (Last 10)</div>
    <div class="log-container">
        <ul id="log"></ul>
    </div>

    <script src="lib/CSInterface.js"></script>
    <script src="main.js"></script>
</body>
</html>
